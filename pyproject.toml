[project]
name = "web-search-tool"
version = "0.1.0"
description = "Reusable web search tool for product lookup and agent integrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.27",
    "langchain-openai>=0.3.32",
    "langgraph>=0.6.0",
    "openai>=1.106.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "rich>=14.0.0",
    "tavily-python>=0.7.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_search_tool"]

[tool.ruff]
line-length = 100
target-version = "py312"
